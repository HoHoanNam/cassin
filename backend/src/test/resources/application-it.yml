# Chỉ nạp khi test có @ActiveProfiles("it"). Ghi đè lên application.yml chính.
#
# KHÔNG khai báo spring.datasource ở đây: DataSource do PostgresContainerConfig hoặc LocalPostgresConfig tạo.
# Flyway vẫn chạy đủ V1 → V14 trên DB trống, Hibernate "validate" entity → lỗi migration lộ ra ngay.

spring:
  flyway:
    # [THÊM] db/testdata: huy hiệu GIẢ (TEST_*) cho BadgeBaseIT, nạp sau mọi migration thật. Chỉ có trong test.
    locations: classpath:db/migration,classpath:db/testdata

cassin:
  # [THÊM] Chạy IT trên DB nào:
  #   container (mặc định): PostgreSQL trong Docker qua Testcontainers, cần Docker Desktop đang chạy
  #   local             : PostgreSQL cài trên máy, DB RIÊNG cassin_it (bị xóa sạch rồi dựng lại mỗi lần chạy)
  # Chọn bằng biến môi trường:  $env:IT_DATABASE="local"
  it:
    database: ${IT_DATABASE:container}
    local:
      url: ${IT_DB_URL:jdbc:postgresql://localhost:5432/cassin_it}
      username: ${DB_USERNAME:cassin}
      password: ${DB_PASSWORD:cassin}
  jwt:
    access-token-ttl: 15m # giá trị mục tiêu, test theo đúng cấu hình sẽ deploy
  refresh-token:
    cookie-secure: false
  badge:
    async: false # xét huy hiệu ngay trên thread gọi → nộp bài xong là kiểm được, không phải chờ
  admin: # AdminBootstrap tạo sẵn admin → section 3 (báo lỗi) dùng
    email: admin@it.local
    password: admin-it-12345

logging:
  level:
    org.testcontainers: INFO
    tc: INFO # log pull image / khởi động container
