<div class="outlet" aria-live="polite">
  @for (toast of toasts.toasts(); track toast.id) {
    <div class="toast" [class.toast-error]="toast.kind === 'error'" [attr.role]="toast.kind === 'error' ? 'alert' : 'status'">
      @switch (toast.kind) {
        @case ('success') { <app-icon class="text-[#9fd3a7]" name="check" [strokeWidth]="2.2" /> }
        @case ('error') { <app-icon class="text-danger-dark" name="alert" [strokeWidth]="2" /> }
        @default { <app-icon class="text-brand-tint" name="info" [strokeWidth]="2" /> }
      }
      <span class="flex-1 text-sm">{{ toast.message }}</span>
      @if (toast.action; as action) {
        <button type="button" class="btn btn-ghost btn-sm" (click)="action.run(); toasts.dismiss(toast.id)">{{ action.label }}</button>
      }
      <button type="button" class="close" aria-label="Đóng thông báo" (click)="toasts.dismiss(toast.id)">
        <app-icon name="close" [size]="16" [strokeWidth]="2" />
      </button>
    </div>
  }
</div>
