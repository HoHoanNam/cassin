<div class="error" role="alert">
  <app-icon class="text-danger-dark" name="alert" [size]="44" [strokeWidth]="1.6" />
  <p class="m-0 text-[17px] font-bold">{{ title() }}</p>
  <p class="m-0 max-w-[28em] text-sm text-ink-soft">{{ message() }}</p>
  <button type="button" class="btn btn-secondary mt-1" (click)="retry.emit()">Thử lại</button>
</div>
