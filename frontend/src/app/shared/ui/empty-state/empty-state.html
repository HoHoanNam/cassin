<div class="empty">
  <app-icon class="text-ink-faint" [name]="icon()" [size]="48" [strokeWidth]="1.4" />
  <p class="m-0 text-[17px] font-bold">{{ title() }}</p>
  @if (description()) {
    <p class="m-0 max-w-[28em] text-sm text-ink-soft">{{ description() }}</p>
  }
  <div class="mt-1 flex flex-wrap justify-center gap-3">
    <ng-content />
  </div>
</div>
