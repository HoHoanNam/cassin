<app-modal [open]="open()" [title]="title()" size="sm" (closed)="cancel()">
  @if (message()) {
    <p class="mb-0 mt-2.5 text-sm leading-relaxed text-ink-soft">{{ message() }}</p>
  }
  <div class="mt-6 flex flex-wrap justify-end gap-2.5">
    <button type="button" class="btn btn-secondary" [disabled]="busy()" (click)="cancel()">{{ cancelLabel() }}</button>
    <button type="button" class="btn" [class.btn-danger]="danger()" [class.btn-primary]="!danger()" [disabled]="busy()"
      (click)="confirmed.emit()">
      {{ busy() ? 'Đang xử lý...' : confirmLabel() }}
    </button>
  </div>
</app-modal>
