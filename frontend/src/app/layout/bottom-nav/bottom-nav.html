<nav class="bottom-nav" aria-label="Điều hướng chính">
  @for (item of items; track item.link) {
    <a class="tab" [routerLink]="item.link" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="relative">
        <app-icon [name]="item.icon" [size]="22" [strokeWidth]="1.9" />
        @if (item.showDue && stats.dueCount() > 0) {
          <span class="badge" [attr.aria-label]="stats.dueCount() + ' thẻ đến hạn'">{{ stats.dueCount() }}</span>
        }
      </span>
      {{ item.label }}
    </a>
  }
</nav>
