<div class="relative">
  <button type="button" class="trigger" [class.trigger-full]="variant() === 'full'" aria-haspopup="menu"
    [attr.aria-expanded]="open()" aria-label="Mở menu tài khoản" (click)="toggle()">
    <span class="avatar" aria-hidden="true">{{ avatar() }}</span>
    @if (variant() === 'full') {
      <span class="flex min-w-0 flex-1 flex-col text-left">
        <span class="text-sm font-semibold">{{ user()?.displayName }}</span>
        <span class="truncate text-xs text-ink-soft">{{ user()?.email }}</span>
      </span>
      <app-icon class="text-ink-soft" name="chevron-down" [size]="18" />
    }
  </button>

  @if (open()) {
    <div class="menu" [class.menu-up]="placement() === 'up'" role="menu">
      @if (variant() === 'avatar') {
        <div class="border-b border-divider px-3 pb-2.5 pt-1.5">
          <p class="m-0 text-sm font-semibold">{{ user()?.displayName }}</p>
          <p class="m-0 truncate text-xs text-ink-soft">{{ user()?.email }}</p>
        </div>
      }
      <a role="menuitem" class="item" routerLink="/account" (click)="open.set(false)">
        <app-icon name="user" [size]="18" /> Tài khoản
      </a>
      @if (isAdmin()) {
        <!-- Điện thoại không có sidebar: vào khu vực quản trị từ đây -->
        <a role="menuitem" class="item" routerLink="/admin" (click)="open.set(false)">
          <app-icon name="shield" [size]="18" /> Quản trị
        </a>
      }
      @if (isMock) {
        <button type="button" role="menuitem" class="item" (click)="resetMockData()">
          <app-icon name="reset" [size]="18" /> Đặt lại dữ liệu mẫu
        </button>
      }
      <button type="button" role="menuitem" class="item" (click)="logout()">
        <app-icon name="logout" [size]="18" /> Đăng xuất
      </button>
    </div>
  }
</div>
