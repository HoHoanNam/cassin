<button type="button" class="card-lines flash" [attr.aria-label]="label()" [attr.aria-pressed]="flipped()" (click)="flip.emit()">
  <span class="meta">
    <span>{{ posLabel() }}</span>
    <span>{{ item().isNew ? 'Thẻ mới' : 'Hộp ' + item().box }}</span>
  </span>

  @if (!flipped()) {
    <span class="face" aria-hidden="true">
      <span class="word">{{ item().term }}</span>
      @if (item().phonetic) {
        <span class="text-lg text-ink-soft">{{ item().phonetic }}</span>
      }
      <!-- Từ nhiều nghĩa: mặt trước gợi ý đang hỏi nghĩa nào (theo loại từ) -->
      @if (item().otherSenses.length > 0) {
        <span class="text-sm text-ink-soft">Từ có {{ item().otherSenses.length + 1 }} nghĩa, thẻ này hỏi nghĩa {{ posLabel() }}</span>
      }
    </span>
  } @else {
    <span class="face" aria-hidden="true">
      <span class="hand meaning">{{ item().definition }}</span>
      @for (example of item().examples; track $index) {
        <span class="max-w-[32em] italic text-ink-soft">{{ example }}</span>
      }
      @if (item().otherSenses.length > 0) {
        <span class="others">
          <span class="text-[12px] uppercase tracking-wide">Nghĩa khác</span>
          @for (other of item().otherSenses; track $index) {
            <span><i>{{ pos[other.partOfSpeech].short || pos[other.partOfSpeech].label }}</i> {{ other.definition }}</span>
          }
        </span>
      }
    </span>
  }
</button>
