<button type="button" class="card-lines flash" [attr.aria-label]="label()" [attr.aria-pressed]="flipped()" (click)="flip.emit()">
  <span class="meta">
    <span>{{ posLabel() }}</span>
    <span>{{ item().isNew ? 'Thẻ mới' : 'Hộp ' + item().box }}</span>
  </span>

  @if (!flipped()) {
    <span class="face" aria-hidden="true">
      <span class="word">{{ item().card.word }}</span>
      @if (item().card.phonetic) {
        <span class="text-lg text-ink-soft">{{ item().card.phonetic }}</span>
      }
    </span>
  } @else {
    <span class="face" aria-hidden="true">
      <span class="hand meaning">{{ item().card.definition }}</span>
      @for (example of item().card.examples; track $index) {
        <span class="max-w-[32em] italic text-ink-soft">{{ example }}</span>
      }
    </span>
  }
</button>
