<fieldset class="m-0 border-0 p-0">
  <legend class="mb-6 w-full">
    <span class="hand block text-xl text-ink-soft">Câu {{ question().position + 1 }} / {{ total() }}</span>
    <span class="mt-1 block text-[22px] font-semibold leading-snug sm:text-2xl">{{ question().content }}</span>
  </legend>

  <div class="flex flex-col gap-3">
    @for (option of question().options; track option.id; let i = $index) {
      <label class="option" [class.option-selected]="selected() === option.id">
        <input type="radio" class="sr-only" [name]="'q-' + question().questionId" [value]="option.id"
          [checked]="selected() === option.id" (change)="select.emit(option.id)" />
        <span class="letter" aria-hidden="true">{{ letters[i] }}</span>
        <span class="flex-1">{{ option.content }}</span>
      </label>
    }
  </div>
</fieldset>
