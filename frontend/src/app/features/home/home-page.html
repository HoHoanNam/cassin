<!-- Đầu trang vở: ngày tháng và tên bài, căn giữa như học sinh vẫn viết -->
<header class="page-head">
  <p class="date">{{ today }}</p>
  <h1 class="title">Ôn tập hôm nay</h1>
</header>

@if (data(); as home) {
  <app-review-panel [review]="home.review" />

  <app-deck-list class="block" [decks]="home.decks" />

  <div class="columns">
    <app-grammar-list [topics]="home.grammarTopics" />
    <app-quiz-history [quizzes]="home.recentQuizzes" />
  </div>
} @else {
  <p class="loading muted" role="status">Đang mở vở…</p>
}
